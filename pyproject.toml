[project]
name = "local-coding-agent-harness"
version = "0.1.0"
description = "A controlled local coding agent runtime for repositories."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.115.0",
  "mcp>=2.0,<3",
  "python-dotenv>=1.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
agent = "cli.app:app"
lcah = "cli.app:app"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent*", "tools*", "runtime*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

